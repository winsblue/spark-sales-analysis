server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ---------------------------------------------------------------------
# 应用自定义配置
# ---------------------------------------------------------------------
app:
  # 金额单位：必须与离线作业 spark-job.properties 的 data.currency.unit 一致
  #   模拟数据源（人民币）→ 元
  #   Olist 真实数据集（巴西雷亚尔）→ BRL
  currency:
    unit: BRL

spring:
  application:
    name: sales-analysis-server
  # 结果库：MySQL 5.5.27，使用 5.1.x 驱动
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/sales_analysis?useUnicode=true&characterEncoding=utf8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: SalesHikariPool
      # 性能优化：MySQL 5.5 默认 tmp_table_size 仅 18MB，
      # 而 COUNT(DISTINCT order_id) 这类去重统计需要临时表，一旦溢写磁盘查询会慢十几倍。
      # 这里在建立物理连接时把会话级临时表上限调大。
      # 实测：商品排行查询由 24s 降至 2s，趋势查询由 37s 降至 2s。
      connection-init-sql: SET SESSION tmp_table_size=134217728, SESSION max_heap_table_size=134217728
  mvc:
    # springdoc-openapi 与 Spring Boot 2.7 搭配时需要使用 ant 路径匹配策略
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sales.server.entity
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: info
    com.sales.server.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
