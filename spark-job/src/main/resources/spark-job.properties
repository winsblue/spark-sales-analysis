# =====================================================================
#  Spark 离线分析作业配置
#  基于 Spark 的电商商品销售离线分析与 Java 服务化应用
#
#  本项目支持两种运行环境，只需改配置、无需改代码：
#    ① Windows/Linux 单机模式（本地开发、答辩演示）：spark.master=local[*]，数据源用本地路径
#    ② Linux 大数据集群模式（生产形态）：spark.master 留空，由 spark-submit --master yarn 指定，
#       数据源改为 HDFS 路径，详见 docs/09-Linux集群部署指南.md
# =====================================================================

# ---------- 数据目录 ----------
# 模拟数据的输出目录（只能是本地路径，数据生成依赖 java.io）
mock.output.dir=data/raw

# 分析作业读取数据的目录：可以是本地路径，也可以是 HDFS 路径
#   单机模式（模拟数据）：data.raw.dir=data/raw
#   单机模式（真实数据）：data.raw.dir=data/real      ← 当前使用真实数据集
#   集群模式：data.raw.dir=hdfs://node1:8020/sales/raw
data.raw.dir=data/real
# 一般无需单独配置，留空即按上面的目录 + 固定文件名推导
# data.raw.order.file=
# data.raw.product.file=

# ---------- 真实数据集（Olist 巴西电商公开数据集）参数 ----------
# 原始文件目录：先执行 scripts/download-real-data.ps1（Windows）
#              或 scripts/linux/download-real-data.sh（Linux）下载到此目录
real.raw.dir=data/real-raw
# 转换后输出的 ODS 标准格式目录（把上面 data.raw.dir 指向它即可跑通全链路）
real.ods.dir=data/real

# ---------- 金额单位 ----------
# 随数据源变化：模拟数据源是人民币（元），Olist 真实数据集是巴西雷亚尔（BRL）。
# 后端 server 的 application.yml 里 app.currency.unit 必须与此保持一致。
data.currency.unit=BRL

# ---------- 模拟数据生成参数 ----------
# 订单明细总行数（含后续注入的脏数据）
mock.row.count=200000
# 商品维度数量
mock.product.count=200
# 随机种子，固定后每次生成的数据完全一致（保证结果可复现）
mock.seed=20260907
# 数据日期范围（共 91 天）
data.start.date=2026-06-01
data.end.date=2026-08-30
# 样例数据条数（写入 data/sample 目录，用于提交到代码仓库）
mock.sample.rows=2000

# ---------- Spark 运行参数 ----------
# 单机模式：使用本机所有 CPU 核心，无需 Hadoop 集群
# 集群模式：把本行留空（或注释掉），改用 spark-submit --master yarn 指定
spark.master=local[*]
spark.app.name=spark-sales-analysis
# shuffle 分区数：单机建议为 CPU 核数；集群建议为 executor 核数 × 2~3
spark.sql.shuffle.partitions=4
# Spark Web UI，单机调试时可设为 true
spark.ui.enabled=false
# Driver 端 collect 的最大结果集，防止误操作把大表拉到本地
spark.driver.maxResultSize=512m

# ---------- 分析参数 ----------
# TopN 排名取前多少名（结果表存全量聚合，排名由后端计算，此处仅作默认值）
analysis.topN=10
# false=按天统计；true=把整段数据当作一个统计日（便于快速演示）
analysis.aggregate.whole.period=false

# ---------- 结果库（MySQL）----------
# 单机模式：MySQL 通常在本机
# 集群模式：需要填写集群各节点都能访问到的 MySQL 地址（executor 会直接从节点写库）
jdbc.url=jdbc:mysql://127.0.0.1:3306/sales_analysis?useUnicode=true&characterEncoding=utf8&useSSL=false
jdbc.user=root
jdbc.password=123456

# ---------- 运行环境 ----------
# Windows 下运行 Spark 需要 winutils.exe / hadoop.dll，此处填写其所在目录（bin 的上一级）。
# Linux / macOS 环境下请留空，或配置环境变量 HADOOP_HOME。
hadoop.home.dir=C:/Users/19351/hadoop
